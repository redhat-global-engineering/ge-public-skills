name: ge-public-skills
owner:
  name: Red Hat Global Engineering
description: Curated AI coding assistant skills for Red Hat engineering
categories:
  evaluation:
    name: Evaluation & Testing
    description: Skills for evaluating and testing AI agent skills
  security:
    name: Security
    description: Skills for secure development, security review, and hardening
plugins:
- name: agent-eval-harness
  description: Generic agentic evaluation for skills and agents. Provides end-to-end
    skills to analyze, test, score, review, and iteratively improve agent skills, plus
    compare models/configurations and run Design-of-Experiments (ANOVA) sweeps, with
    MLflow support for experiment tracking, tracing, and reporting.
  version: 1.33.0
  category: evaluation
  scope: generic
  tags:
  - evaluation
  - testing
  - skills
  - agents
  - mlflow
  - optimization
  - scoring
  - comparison
  - doe
  - anova
  author:
    name: Antonin Stefanutti
  license: Apache-2.0
  source:
    type: github
    repo: opendatahub-io/agent-eval-harness
    ref: v1.33.0
    sha: cb5f5cb4eb683b81f763dd7aadab7a13d1293bb0
  homepage: https://github.com/opendatahub-io/agent-eval-harness
  repository: https://github.com/opendatahub-io/agent-eval-harness
  skills:
  - name: eval-setup
    description: Optional environment configurator that verifies dependencies, API
      keys, and MLflow tracking, and suggests evaluation modes based on repository
      contents
  - name: eval-analyze
    description: Deep-read a target skill (or run a custom analysis prompt) and generate
      a complete eval.yaml with dataset schema, outputs, judges, models, and thresholds
  - name: eval-dataset
    description: Generate evaluation test cases for an eval.yaml — from skill analysis,
      synthetic LLM generation, or MLflow traces — bootstrapping or augmenting a dataset
  - name: eval-run
    description: Execute an evaluation against test cases (skill or prompt mode), score
      outputs with judges, detect regressions against a baseline, and report results
  - name: eval-compare
    description: Compare eval results across models or runs — discover a directory of
      run artifacts and generate a tabbed HTML report with model cards, quality/cost
      tables, and per-case breakdowns
  - name: eval-anova
    description: Design-of-Experiments (DoE) evaluation — fan a matrix of agent configs
      across shared cases, then run repeated-measures/mixed-effects ANOVA (F, p, effect
      size) plus a cost/quality Pareto
  - name: eval-review
    description: Interactive human-in-the-loop review of judge scores and skill outputs
      that captures qualitative feedback and proposes SKILL.md improvements
  - name: eval-mlflow
    description: Bidirectional MLflow integration — sync datasets, log run params/metrics/traces,
      and push/pull judge and human feedback
  - name: eval-optimize
    description: Automated improvement loop that identifies judge failures, edits SKILL.md,
      and re-runs with regression checks until judges pass
  - name: eval-check
    description: Full-harness configuration health check - scans skills, commands,
      CLAUDE.md, and hooks for redundancy, overlap, misclassification, and structural
      issues
  python:
    package: agent-eval-harness
    requires_python: '>=3.11'
- name: prodsec-skills-ge-core
  description: GE Core — 12 curated security skills for developers writing code
    daily. Injection defense, web application security, secrets detection, container
    hardening, OpenShift/Kubernetes access control, dependency auditing, authentication,
    secure-by-design, audit logging, and AI security.
  version: "1.0.0"
  category: security
  scope: generic
  strict: false
  skills_dir: "."
  tags:
  - security
  - secure-development
  - injection
  - secrets-detection
  - container-hardening
  - kubernetes
  - openshift
  - supply-chain
  - web-security
  - ai-security
  author:
    name: Red Hat Product Security
  license: Apache-2.0
  source:
    type: git-subdir
    url: https://github.com/RedHatProductSecurity/prodsec-skills.git
    ref: main
    sha: b55c6b9c3392645f62da59a447c29473c413e371
    path: ge-core
  homepage: https://github.com/RedHatProductSecurity/prodsec-skills/tree/main/ge-core
  repository: https://github.com/RedHatProductSecurity/prodsec-skills
  skills:
  - name: ai-code-review
    description: Security-focused review of AI-generated or AI-assisted code, covering
      failure modes specific to AI code generation
  - name: ai-systems-security
    description: Secure AI-powered products and infrastructure — LLM API integration,
      agent workflows, and MCP servers
  - name: authentication
    description: Enforce standard authentication protocols for external data source
      connections
  - name: container-hardening
    description: Harden container images and runtime configuration for Kubernetes
      and OpenShift
  - name: dependency-vulnerability-audit
    description: Supply chain audit using CLI vulnerability scanners, license compliance
      checks, and risk assessment
  - name: input-validation-injection
    description: Prevent SQL, LDAP, and OS command injection and prototype pollution
      through validation strategy
  - name: logging
    description: Enforce audit logging of access to sensitive external data sources
  - name: pod-access-control
    description: Kubernetes RBAC bindings, service accounts, namespaces, and resource
      quotas for least-privilege workloads
  - name: scc-security
    description: Review OpenShift Security Context Constraints for correct privilege
      levels
  - name: secrets-detection-patterns
    description: Pattern-based detection of hardcoded secrets in source code, with
      false-positive filtering
  - name: secure-by-design
    description: Apply Secure by Design, by Default, and in Deployment (SD3) principles
  - name: web-application-security
    description: OWASP-aligned review of server-side web application security controls
- name: qualityflow
  description: AI-powered test planning and code generation framework. Automates the
    full test engineering lifecycle — from Jira ticket or GitHub issue to working test
    code — with automated QE review, structured verdicts, and multi-project configuration.
  version: "1.0.0"
  category: evaluation
  scope: generic
  tags:
  - testing
  - test-planning
  - code-generation
  - quality-engineering
  - jira
  - evaluation
  - review
  author:
    name: Red Hat QE Data Science
  license: Apache-2.0
  source:
    type: github
    repo: redhat-community-ai-tools/qualityflow
    ref: main
    sha: 95a4eef8630e6b84eef289d9bc84ddee04449a6a
  homepage: https://github.com/redhat-community-ai-tools/qualityflow
  repository: https://github.com/redhat-community-ai-tools/qualityflow
  skills:
  - name: project-resolver
    description: Multi-project config routing — resolves Jira prefix or GitHub repo
      to project configuration
  - name: requirement-mapper
    description: Extract and map Jira acceptance criteria to testable requirements
  - name: scenario-builder
    description: Generate test scenarios from mapped requirements with priority and
      tier classification
  - name: tier-classifier
    description: Classify test scenarios into project-defined tiers based on scope
      and complexity
  - name: test-strategy-resolver
    description: Auto-detect language, framework, and test conventions from source
      repository
  - name: template-engine
    description: Render STP and STD documents from templates with project-specific
      configuration
  - name: stp-reviewer
    description: Semantic QE review of STP documents — 7 dimensions, 16 domain rules,
      structured APPROVED/NEEDS_REVISION verdicts
  - name: std-generator
    description: Generate Software Test Description YAML from approved STP documents
  - name: std-reviewer
    description: Semantic review of STD documents for STP traceability, pattern correctness,
      and code generation readiness
  - name: stub-generator
    description: Generate test stubs with PSE docstrings in any configured language
      and framework
  - name: test-generator
    description: Fill test stubs with working implementations that compile and pass
      collection
  - name: pr-analyzer
    description: Analyze PR diffs and review comments for test planning context
  - name: lsp-tracer
    description: LSP-based call graph tracing for regression impact analysis
  - name: pii-sanitizer
    description: Configurable PII redaction in generated documents — customer names,
      IPs, hostnames
  - name: comment-classifier
    description: Classify PR review comments for automated fix routing
  - name: review-rules-extractor
    description: Auto-extract project-specific review rules from config files and
      source repositories
  - name: feature-finder
    description: Map code changes to user-facing features via LSP analysis
  - name: jira-parser
    description: Normalize Jira issue fields for pipeline consumption
  - name: link-resolver
    description: Build dependency graphs from cross-references in issue data
  - name: output-validator
    description: Structural validation of generated STP and STD artifacts
  - name: std-orchestrator
    description: Coordinate the STD generation pipeline across skills
  - name: ticket-assessor
    description: Assess ticket risk and complexity for test planning prioritization
  - name: table-generator
    description: Render markdown tables for STP and review report sections
  - name: pipeline-state
    description: Track pipeline phase status for error reporting and resumption
